name: rss_glassmorphism_reader
description: A local-first glassmorphism RSS reader
version: 0.5.0+0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # State Management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # Parsing
  xml: ^6.5.0
  html: ^0.15.4

  # UI
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0

  # Utilities
  uuid: ^4.2.1
  intl: ^0.18.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  logger: ^2.0.2
  collection: ^1.18.0

  # Storage
  shared_preferences: ^2.2.2

  # Platform
  file_picker: ^6.1.1

  # Web Support
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
